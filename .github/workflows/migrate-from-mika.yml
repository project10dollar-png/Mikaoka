name: Migrate Mika into Mikaoka

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mika fork with full history
        uses: actions/checkout@v4
        with:
          repository: project10dollar-png/Mika
          ref: feature/hey-oka-branding
          fetch-depth: 0
          path: source

      - name: Replace Mikaoka main with the customized Mika branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          git -C source config user.name "github-actions[bot]"
          git -C source config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C source remote add target "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          git -C source push --force target \
  refs/heads/feature/hey-oka-branding:refs/heads/main \
  refs/heads/feature/hey-oka-branding:refs/heads/feature/hey-oka-branding \
  refs/heads/main:refs/heads/upstream-main \
  --tags
